services:
  db:
    image: postgres:16-alpine
    container_name: wcs_postgres
    environment:
      POSTGRES_USER: wcs_user
      POSTGRES_PASSWORD: wcs_secret
      POSTGRES_DB: wcs_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcs_user -d wcs_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wcs_api
    environment:
      DATABASE_URL: postgresql+asyncpg://wcs_user:wcs_secret@db:5432/wcs_db
      DATABASE_URL_SYNC: postgresql://wcs_user:wcs_secret@db:5432/wcs_db
      SECRET_KEY: dev-secret-key-change-in-production-32chars
      SORTER_API_KEY: sorter-api-key-change-me
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:5173"]'
      # Webhook de saída WCS → WMS (padrão vazio = notificação simulada)
      WMS_WEBHOOK_URL: ${WMS_WEBHOOK_URL:-}
      WMS_API_KEY: ${WMS_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # No Docker Desktop, host.docker.internal já resolve o host.
    # No Linux, descomente a linha abaixo para o container alcançar um mock no host (ex.: SoapUI :8089).
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
